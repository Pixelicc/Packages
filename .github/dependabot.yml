version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/packages/logger"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@logger"
  - package-ecosystem: "npm"
    directory: "/packages/web-logger"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "@web-logger"
